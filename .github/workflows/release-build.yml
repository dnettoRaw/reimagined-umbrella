name: Release build

on:
  push:
    branches:
      - release
  pull_request:
    branches:
      - release
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  rust:
    name: Rust release (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
            executable_suffix: ""
            package: proexel-rust-linux-x64.tar.gz
          - os: windows-latest
            platform: windows-x64
            executable_suffix: .exe
            package: proexel-rust-windows-x64.zip
          - os: macos-15
            platform: macos-arm64
            executable_suffix: ""
            package: proexel-rust-macos-arm64.tar.gz

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Resolve pinned AppCore revision
        id: appcore
        shell: bash
        run: echo "revision=$(git rev-parse HEAD:core/AppCore-Runtime)" >> "$GITHUB_OUTPUT"

      - name: Require AppCore repository token
        shell: bash
        env:
          APPCORE_REPOSITORY_TOKEN: ${{ secrets.APPCORE_REPOSITORY_TOKEN }}
        run: |
          if [ -z "$APPCORE_REPOSITORY_TOKEN" ]; then
            echo "::error::Configure the APPCORE_REPOSITORY_TOKEN repository secret with read access to dnettoRaw/AppCore-Runtime."
            exit 1
          fi

      - name: Check out pinned AppCore revision
        uses: actions/checkout@v6
        with:
          repository: dnettoRaw/AppCore-Runtime
          ref: ${{ steps.appcore.outputs.revision }}
          path: core/AppCore-Runtime
          token: ${{ secrets.APPCORE_REPOSITORY_TOKEN }}
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy, rustfmt

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            proexel -> target
            core/AppCore-Runtime -> target

      - name: Check Rust structure
        shell: bash
        run: ./proexel/scripts/check-rust-structure.sh

      - name: Check formatting
        working-directory: proexel
        run: cargo fmt --all -- --check

      - name: Run Clippy
        working-directory: proexel
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run tests
        working-directory: proexel
        run: cargo test --workspace --locked

      - name: Build optimized binaries
        working-directory: proexel
        run: cargo build --workspace --release --locked

      - name: Stage Rust binaries
        working-directory: proexel
        shell: bash
        run: |
          mkdir -p release/rust
          cp "target/release/proexel-service${{ matrix.executable_suffix }}" release/rust/
          cp "target/release/proexel-migrate${{ matrix.executable_suffix }}" release/rust/

      - name: Package Unix Rust binaries
        if: runner.os != 'Windows'
        working-directory: proexel
        shell: bash
        run: |
          tar -czf "release/${{ matrix.package }}" -C release/rust .

      - name: Package Windows Rust binaries
        if: runner.os == 'Windows'
        working-directory: proexel
        shell: pwsh
        run: Compress-Archive -Path release/rust/* -DestinationPath "release/${{ matrix.package }}"

      - name: Upload Rust artifact
        uses: actions/upload-artifact@v6
        with:
          name: proexel-rust-${{ matrix.platform }}-${{ github.sha }}
          path: proexel/release/${{ matrix.package }}
          if-no-files-found: error
          retention-days: 30

  web:
    name: Web release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: proexel/apps/web/package-lock.json

      - name: Install dependencies
        working-directory: proexel/apps/web
        run: npm ci

      - name: Check formatting and lint
        working-directory: proexel/apps/web
        run: npm run check

      - name: Check TypeScript
        working-directory: proexel/apps/web
        run: npx tsc --noEmit

      - name: Build standalone application
        working-directory: proexel/apps/web
        run: npm run build

      - name: Package web application
        working-directory: proexel/apps/web
        run: |
          mkdir -p release/web/.next
          cp -R .next/standalone/. release/web/
          cp -R .next/static release/web/.next/static
          tar -czf release/proexel-web-linux-x64.tar.gz -C release/web .

      - name: Upload web artifact
        uses: actions/upload-artifact@v6
        with:
          name: proexel-web-linux-x64-${{ github.sha }}
          path: proexel/apps/web/release/proexel-web-linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish GitHub release
    if: github.event_name == 'push' && github.ref == 'refs/heads/release'
    needs:
      - rust
      - web
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: proexel-*
          path: release-assets
          merge-multiple: true

      - name: Publish release and assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: release-${{ github.run_number }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
            gh release edit "$RELEASE_TAG" --latest
          else
            gh release create "$RELEASE_TAG" release-assets/* \
              --target "$GITHUB_SHA" \
              --title "PROEXEL release build #${GITHUB_RUN_NUMBER}" \
              --generate-notes \
              --latest
          fi
